name: vitaline

services:
  mongodb:
    image: mongo:8.0.29-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" | grep 1",
        ]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

  backend:
    image: vitaline-backend:compose
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/vitaline?replicaSet=rs0
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  admin-seed:
    image: vitaline-backend:compose
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["node", "dist/src/scripts/seedAdmin.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/vitaline?replicaSet=rs0
      ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_PHONE: ${ADMIN_PHONE:?ADMIN_PHONE is required}
      ADMIN_IMAGE: ${ADMIN_IMAGE:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  mongodb_data:
