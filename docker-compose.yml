name: vitaline

services:
  mongodb:
    image: mongo:8.0.29-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1g
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().members.some(m => m.stateStr === 'PRIMARY') } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); false }\" | grep true",
        ]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

  mongo-tools:
    image: mongo:8.0.29-noble
    profiles: ["tools"]
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    volumes:
      - ./backups:/backups
      - ./scripts/mongodb:/scripts:ro
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    image: vitaline-api-gateway:compose
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: ${API_GATEWAY_PORT:-4000}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5001}
      PATIENT_SERVICE_URL: ${PATIENT_SERVICE_URL:-http://patient-service:5002}
      DOCTOR_SERVICE_URL: ${DOCTOR_SERVICE_URL:-http://doctor-service:5003}
      APPOINTMENT_SERVICE_URL: ${APPOINTMENT_SERVICE_URL:-http://appointment-service:5004}
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy

  auth-service:
    image: vitaline-auth-service:compose
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: ${AUTH_SERVICE_PORT:-5001}
      MONGODB_URI: ${AUTH_MONGODB_URI:-mongodb://mongodb:27017/vitaline_auth?replicaSet=rs0}
      PATIENT_SERVICE_URL: ${PATIENT_SERVICE_URL:-http://patient-service:5002}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_PHONE: ${ADMIN_PHONE:?ADMIN_PHONE is required}
      ADMIN_IMAGE: ${ADMIN_IMAGE:-}
    depends_on:
      mongodb:
        condition: service_healthy

  patient-service:
    image: vitaline-patient-service:compose
    build:
      context: ./backend/patient-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: ${PATIENT_SERVICE_PORT:-5002}
      MONGODB_URI: ${PATIENT_MONGODB_URI:-mongodb://mongodb:27017/vitaline_patients?replicaSet=rs0}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5001}
      APPOINTMENT_SERVICE_URL: ${APPOINTMENT_SERVICE_URL:-http://appointment-service:5004}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  doctor-service:
    image: vitaline-doctor-service:compose
    build:
      context: ./backend/doctor-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      PORT: ${DOCTOR_SERVICE_PORT:-5003}
      MONGODB_URI: ${DOCTOR_MONGODB_URI:-mongodb://mongodb:27017/vitaline_doctors?replicaSet=rs0}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5001}
      APPOINTMENT_SERVICE_URL: ${APPOINTMENT_SERVICE_URL:-http://appointment-service:5004}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  appointment-service:
    image: vitaline-appointment-service:compose
    build:
      context: ./backend/appointment-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Istanbul}
      PORT: ${APPOINTMENT_SERVICE_PORT:-5004}
      MONGODB_URI: ${APPOINTMENT_MONGODB_URI:-mongodb://mongodb:27017/vitaline_appointments?replicaSet=rs0}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:5001}
      DOCTOR_SERVICE_URL: ${DOCTOR_SERVICE_URL:-http://doctor-service:5003}
      PATIENT_SERVICE_URL: ${PATIENT_SERVICE_URL:-http://patient-service:5002}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: vitaline-frontend:compose
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongodb_data:
