name: vitaline

services:
  mongodb:
    image: mongo:8.0.29-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    cpus: "1.00"
    mem_limit: 1g
    volumes:
      - mongodb_data:/data/db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status().members.some(m => m.stateStr === 'PRIMARY') } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); false }\" | grep true",
        ]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 30

  mongo-tools:
    image: mongo:8.0.29-noble
    profiles: ["tools"]
    restart: "no"
    cpus: "0.50"
    mem_limit: 512m
    volumes:
      - ./backups:/backups
      - ./scripts/mongodb:/scripts:ro
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    image: vitaline-api-gateway:compose
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/api-gateway/.env.docker
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      doctor-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy

  auth-service:
    image: vitaline-auth-service:compose
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/auth-service/.env.docker
    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ADMIN_NAME: ${ADMIN_NAME:?ADMIN_NAME is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_PHONE: ${ADMIN_PHONE:?ADMIN_PHONE is required}
      ADMIN_IMAGE: ${ADMIN_IMAGE:-}
    depends_on:
      mongodb:
        condition: service_healthy

  patient-service:
    image: vitaline-patient-service:compose
    build:
      context: ./backend/patient-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/patient-service/.env.docker
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  doctor-service:
    image: vitaline-doctor-service:compose
    build:
      context: ./backend/doctor-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/doctor-service/.env.docker
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  appointment-service:
    image: vitaline-appointment-service:compose
    build:
      context: ./backend/appointment-service
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./backend/appointment-service/.env.docker
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: vitaline-frontend:compose
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  mongodb_data:
