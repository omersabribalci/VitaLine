server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Container liveness check: this verifies that Nginx can answer requests.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Keep one public origin. The browser calls /api and Nginx forwards the
  # original path to the backend service on Docker's private network.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed Vite assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router handles application routes in the browser.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
