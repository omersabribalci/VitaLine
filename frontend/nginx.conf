server {
  listen 80;
  server_name _;

  # Docker container IPs can change after a rebuild. Resolve service names
  # repeatedly through Docker's embedded DNS instead of caching one startup IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  # Container liveness check: this verifies that Nginx can answer requests.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Keep one public origin. The browser calls /api and Nginx forwards the
  # original path to the API Gateway on Docker's private network.
  location /api/ {
    set $api_gateway http://api-gateway:4000;
    proxy_pass $api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI and its machine-readable OpenAPI document also belong to the
  # gateway. This prefix covers /api-docs, its static assets, and .json.
  location /api-docs {
    set $api_gateway http://api-gateway:4000;
    proxy_pass $api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed Vite assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React Router handles application routes in the browser.
  # React’in derlenmiş HTML, CSS ve JavaScript dosyalarını döndürüyor.

  location / {
    try_files $uri $uri/ /index.html;
  }
}
