openapi: 3.1.0
info:
  title: VitaLine Microservice API
  version: 1.0.0
  description: |
    VitaLine'in tarayiciya acik REST API sozlesmesi. Tum istekler API Gateway
    uzerinden ilgili servise yonlendirilir. Login yanitindaki data.token degerini
    Swagger Authorize penceresine Bearer yazmadan yapistirin.
servers:
  - url: /
    description: Frontend Nginx ve API Gateway uzerinden ayni origin
tags:
  - { name: System }
  - { name: Auth }
  - { name: Patients }
  - { name: Doctors }
  - { name: Appointments }
  - { name: Booking policy }

paths:
  /health:
    get:
      tags: [System]
      summary: API Gateway saglik kontrolu
      security: []
      responses:
        "200":
          description: Gateway calisiyor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Oturum ac ve access token al
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: HttpOnly refresh cookie ile access token yenile
      security: [{ refreshCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/AuthSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Refresh oturumunu sonlandir
      security: [{ refreshCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Hasta hesabi ve profili olustur
      description: Auth kullanicisi ve Patient profili sirali servis cagrilariyla olusturulur.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPatientRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/patients:
    get:
      tags: [Patients]
      summary: Hastalari sayfali listele
      description: "Roller: admin, doctor."
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/patients/me:
    get:
      tags: [Patients]
      summary: Oturumdaki hastanin profilini getir
      description: "Rol: patient."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/patients/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Patients]
      summary: Hastayi ID ile getir
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Patients]
      summary: Hasta hesap durumunu degistir
      description: "Rol: admin."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountStatus]
              properties:
                accountStatus: { $ref: "#/components/schemas/AccountStatus" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Patients]
      summary: Hastayi pasiflestir
      description: Rol admin; gelecek randevular iptal edilir ve Auth hesabi pasiflestirilir.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/doctors:
    get:
      tags: [Doctors]
      summary: Doktorlari filtreleyip sayfali listele
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: speciality
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name] }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Doctors]
      summary: Doktor hesabi ve profili olustur
      description: Rol admin; Auth kullanicisi ve Doctor profili sirali servis cagrilariyla olusturulur.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDoctorRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/doctors/me:
    get:
      tags: [Doctors]
      summary: Oturumdaki doktorun profilini getir
      description: "Rol: doctor."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/doctors/catalog:
    get:
      tags: [Doctors]
      summary: Doktor formu icin ortak unvan ve uzmanlik katalogunu getir
      description: Roller admin, doctor veya patient.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/doctors/specialities/available:
    get:
      tags: [Doctors]
      summary: En az bir aktif doktoru bulunan uzmanliklari getir
      description: Randevu ve filtre ekranlarinda secilebilecek uzmanliklari doner.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/doctors/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Doctors]
      summary: Doktoru ID ile getir
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Doctors]
      summary: Doktor profilini guncelle
      description: Auth'a ve Doctor servisine ait alanlar ilgili serviste guncellenir.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDoctorRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Doctors]
      summary: Doktoru pasiflestir
      description: Rol admin; gelecek randevular iptal edilir ve Auth hesabi pasiflestirilir.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/appointments:
    get:
      tags: [Appointments]
      summary: Yetkili kapsamdaki randevulari sayfali listele
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: doctorId, in: query, schema: { $ref: "#/components/schemas/ObjectId" } }
        - { name: patientId, in: query, schema: { $ref: "#/components/schemas/ObjectId" } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      tags: [Appointments]
      summary: Randevu olustur
      description: Roller patient veya admin; patient kimligi tokendan belirlenir ve slot cakismalarini MongoDB unique indexleri engeller.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAppointmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/appointments/statistics:
    get:
      tags: [Appointments]
      summary: Admin dashboard istatistiklerini getir
      description: "Rol: admin."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/appointments/availability:
    get:
      tags: [Appointments]
      summary: Doktorun bir gundeki uygun slotlarini getir
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctorId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-09-14" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /api/appointments/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Appointments]
      summary: Yetkili randevuyu getir
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Appointments]
      summary: Yetki kurallarina gore randevuyu guncelle
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAppointmentRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Appointments]
      summary: Randevuyu sil
      description: "Rol: admin."
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/booking-policy:
    get:
      tags: [Booking policy]
      summary: Aktif rezervasyon politikasini getir
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      tags: [Booking policy]
      summary: Rezervasyon politikasini guncelle
      description: "Rol: admin."
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingPolicyUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ObjectId" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
  responses:
    Success:
      description: Islem basarili.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    AuthSuccess:
      description: Oturum bilgileri.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResponse" }
    ValidationError:
      description: Istek dogrulama hatasi.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Kimlik dogrulanamadi veya token gecersiz.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Rol veya kaynak sahipligi izin vermiyor.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Kaynak bulunamadi.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: E-posta veya randevu slotu cakismasi.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, format: password, minLength: 8 }
    RegisterPatientRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, confirmPassword]
      properties:
        name: { type: string, minLength: 3, maxLength: 30 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, pattern: "^[0-9]{11}$", example: "05555555555" }
        password: { type: string, format: password, minLength: 8, example: Test1234 }
        confirmPassword: { type: string, format: password, minLength: 8, example: Test1234 }
        image: { type: string, default: "" }
    CreateDoctorRequest:
      type: object
      additionalProperties: false
      required: [name, email, phone, password, title, speciality]
      properties:
        name: { type: string, minLength: 3, maxLength: 30 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, pattern: "^[0-9]{11}$" }
        password: { type: string, format: password, minLength: 8 }
        image: { type: string }
        title: { type: string, enum: [Dr., Ast. Dr., Uzm. Dr., Op. Dr., Doç. Dr., Prof. Dr.] }
        speciality: { type: string }
    UpdateDoctorRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 30 }
        email: { type: string, format: email }
        phone: { type: string, pattern: "^[0-9]{11}$" }
        image: { type: string }
        password:
          type: string
          format: password
          minLength: 8
          pattern: "^(?=.*[A-Z])(?=.*[a-z])(?=.*\\d).+$"
          description: Admin doktorun yeni sifresini gonderebilir; bos birakilirsa degismez.
        title: { type: string, enum: [Dr., Ast. Dr., Uzm. Dr., Op. Dr., Doç. Dr., Prof. Dr.] }
        speciality: { type: string }
        unavailableDates:
          type: array
          maxItems: 50
          items:
            type: object
            required: [start, end]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [doctorId, dateAndTime]
      properties:
        doctorId: { $ref: "#/components/schemas/ObjectId" }
        patientId:
          allOf: [{ $ref: "#/components/schemas/ObjectId" }]
          description: Admin icin zorunlu; patient icin tokendan belirlenir.
        dateAndTime: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
    UpdateAppointmentRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        doctorId: { $ref: "#/components/schemas/ObjectId" }
        patientId: { $ref: "#/components/schemas/ObjectId" }
        dateAndTime: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
    BookingPolicyUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        appointmentDurationMinutes: { type: integer, minimum: 5, maximum: 60 }
        bookingWindowDays: { type: integer, minimum: 1, maximum: 365 }
        workingTimeStart: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workingTimeEnd: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        workingDays:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 6 }
        lunchBreakStart: { type: [string, "null"] }
        lunchBreakEnd: { type: [string, "null"] }
    AccountStatus:
      type: string
      enum: [enabled, disabled]
    AppointmentStatus:
      type: string
      enum: [scheduled, completed, cancelled]
    User:
      type: object
      required: [_id, name, email, phone, image, role]
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        image: { type: string }
        role: { type: string, enum: [admin, doctor, patient] }
    AuthResponse:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - type: object
          properties:
            data:
              type: object
              required: [token, user]
              properties:
                token: { type: string, description: JWT access token }
                user: { $ref: "#/components/schemas/User" }
